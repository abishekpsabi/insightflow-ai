name: Daily Sales Forecast

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r ai_logic/requirements.txt

      - name: Run Forecast Model
        run: |
          python ai_logic/generate_data.py
          python ai_logic/train_models.py
