name: Daily Sales Forecast

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r ai_logic/requirements.txt

      - name: Run Forecast Model
        run: |
          python ai_logic/generate_data.py
          python ai_logic/train_models.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update sales forecast [skip ci]" || echo "No changes to commit"
          git push
